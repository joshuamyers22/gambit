name: CI

on:
  push:
  pull_request:

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Reject stale dependency metadata
        run: uv lock --check

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Audit exact locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project | \
            uv tool run pip-audit==2.10.1 --strict --disable-pip --no-deps -r /dev/stdin

  native-compiler-warnings:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native dependencies on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzip-dev pkg-config
      - name: Install native dependencies on macOS
        if: runner.os == 'macOS'
        run: brew install libzip pkg-config
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install numpy pybind11
      - name: Compile project-owned C++ with warnings as errors
        run: python tools/check_native_warnings.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libzip on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - name: Install libzip on macOS
        if: runner.os == 'macOS'
        run: brew install libzip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run unit suite
        run: python -m pytest -m unit --cov=gambit --cov-report=term-missing
      - name: Enforce supported policy coverage floors
        run: python tools/check_coverage_policy.py
      - run: python -m ruff check src tests tools
      - run: python -m mypy

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run integration suite
        run: python -m pytest -m integration

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install libzip on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - name: Install libzip on macOS
        if: runner.os == 'macOS'
        run: brew install libzip
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run native correctness suite
        run: python -m pytest -m "native and not fuzz and not performance"

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebooks]"
      - run: python -m ipykernel install --user --name gambit-ci
      - name: Verify committed notebooks are output-free
        run: python tools/check_notebook_cleanliness.py
      - run: jupyter execute examples/notebooks/getting_started.ipynb --kernel_name gambit-ci --timeout 300
      - run: jupyter execute examples/notebooks/multiple_contracts.ipynb --kernel_name gambit-ci --timeout 300
      - run: jupyter execute examples/notebooks/reporting.ipynb --kernel_name gambit-ci --timeout 300
      - run: jupyter execute examples/notebooks/options_trading.ipynb --kernel_name gambit-ci --timeout 300
      - run: jupyter execute examples/notebooks/optimizing_strategies.ipynb --kernel_name gambit-ci --timeout 300
      - run: jupyter execute examples/notebooks/data/create_data.ipynb --kernel_name gambit-ci --timeout 300
      - name: Normalize notebook execution artifacts
        run: python tools/migrate_notebooks.py
      - name: Reject notebook source or metadata drift
        run: python tools/check_clean_paths.py examples/notebooks

  native-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - name: Build native extensions with ASan and UBSan
        env:
          GAMBIT_SANITIZE: "1"
        run: python -m pip install -e ".[dev]"
      - name: Configure sanitizer runtime
        run: |
          echo "ASAN_LIBRARY=$(gcc -print-file-name=libasan.so)" >> "$GITHUB_ENV"
          echo "CXX_LIBRARY=$(g++ -print-file-name=libstdc++.so.6)" >> "$GITHUB_ENV"
      - name: Run native boundary tests
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          GAMBIT_SANITIZER_RUN: "1"
          PYTHONFAULTHANDLER: "1"
          PYTHONUNBUFFERED: "1"
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >-
          LD_PRELOAD="$ASAN_LIBRARY:$CXX_LIBRARY"
          python -m pytest -vv -s
          tests/test_boundary_fuzz.py
          tests/test_native_reference.py
          tests/test_native_io_hardening.py
          tests/test_factor_cache.py
          tests/test_tick_ring.py
          tests/test_public_api.py
      - name: Run native leak stress probe
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: suppressions=tests/lsan.supp:print_suppressions=1
          PYTHONFAULTHANDLER: "1"
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: LD_PRELOAD="$ASAN_LIBRARY:$CXX_LIBRARY" python tests/native_memory_probe.py

  native-thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build standalone SPSC stress test with ThreadSanitizer
        run: >-
          g++ -std=c++11 -O1 -g -Wall -Wextra -Wpedantic -Werror
          -fsanitize=thread -fno-omit-frame-pointer -pthread
          -Isrc/gambit/cpp/factor_cache
          tests/cpp/tick_ring_tsan.cpp
          -o /tmp/gambit-tick-ring-tsan
      - name: Run SPSC stress test under ThreadSanitizer
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: /tmp/gambit-tick-ring-tsan

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libzip-dev
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build packaging twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Inspect distribution contents and metadata
        run: python tools/verify_release_artifacts.py dist
      - name: Smoke-test installed wheel and console script
        run: python tools/verify_release_installations.py dist
