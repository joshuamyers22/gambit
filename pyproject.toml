[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3.0", "numpy>=1.26", "pybind11>=2.13"]
build-backend = "setuptools.build_meta"

[project]
name = "gambit-markets"
version = "1.1.0"
description = "Fast, extensible quantitative strategy backtesting"
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Gambit contributors" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "polars>=1.8",
  "python-dateutil>=2.9",
  "pyyaml>=6.0",
  "sortedcontainers>=2.4",
]

[project.optional-dependencies]
calendars = ["pandas-market-calendars>=4.4"]
persistence = ["h5py>=3.10"]
research = ["scipy>=1.11", "statsmodels>=0.14"]
visualization = ["ipython>=8.18", "ipywidgets>=8.1", "plotly>=5.18", "traitlets>=5.14"]
notebooks = ["h5py>=3.10", "ipykernel>=6.29", "ipython>=8.18", "ipywidgets>=8.1", "nbclient>=0.10", "nbconvert>=7.16", "nbformat>=5.10", "pandas-market-calendars>=4.4", "plotly>=5.18", "scipy>=1.11", "statsmodels>=0.14", "traitlets>=5.14"]
all = ["h5py>=3.10", "ipython>=8.18", "ipywidgets>=8.1", "pandas-market-calendars>=4.4", "plotly>=5.18", "scipy>=1.11", "statsmodels>=0.14", "traitlets>=5.14"]
dev = [
  "build>=1.2",
  "cibuildwheel>=4.2; python_version >= '3.11'",
  "mypy>=1.11",
  "h5py>=3.10",
  "ipython>=8.18",
  "ipywidgets>=8.1",
  "pandas-market-calendars>=4.4",
  "pip-audit>=2.9",
  "plotly>=5.18",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "traitlets>=5.14",
  "twine>=5.1",
  "tomli>=2.0; python_version < '3.11'",
  "types-PyYAML>=6.0",
  "types-python-dateutil>=2.9",
]
docs = ["h5py>=3.10", "ipython>=8.18", "ipywidgets>=8.1", "pandas-market-calendars>=4.4", "plotly>=5.18", "pydata-sphinx-theme>=0.16", "scipy>=1.11", "sphinx>=7.4", "sphinx-autodoc-typehints>=2.2", "statsmodels>=0.14", "traitlets>=5.14"]

[project.urls]
Repository = "https://github.com/joshuamyers22/gambit"
Issues = "https://github.com/joshuamyers22/gambit/issues"
Documentation = "https://joshuamyers22.github.io/gambit/"
Changelog = "https://github.com/joshuamyers22/gambit/blob/main/CHANGELOG.md"

[project.scripts]
gambit-factor-cache = "gambit.factor_cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-config --strict-markers"
markers = [
  "fuzz: deterministic hostile-input crash and hang probes",
  "integration: crosses package, process, persistence, or example boundaries",
  "native: requires compiled native extensions",
  "notebook: executes notebook examples",
  "performance: benchmark correctness smoke tests and performance measurements",
  "slow: takes more than a few seconds",
  "unit: isolated deterministic behavior with no external process or persistence boundary",
]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E701", "E741"]

[tool.mypy]
python_version = "3.12"
files = [
  "setup.py",
  "src/gambit/__init__.py",
  "src/gambit/account.py",
  "src/gambit/backtest_result.py",
  "src/gambit/boundaries.py",
  "src/gambit/calculation.py",
  "src/gambit/callback_contracts.py",
  "src/gambit/configuration.py",
  "src/gambit/control_plane.py",
  "src/gambit/contract_pnl.py",
  "src/gambit/covariance_risk.py",
  "src/gambit/currency.py",
  "src/gambit/factor_admission.py",
  "src/gambit/factor_cache.py",
  "src/gambit/factor_cli.py",
  "src/gambit/factor_dag.py",
  "src/gambit/factor_device.py",
  "src/gambit/factor_identity.py",
  "src/gambit/factor_metrics.py",
  "src/gambit/factor_operations.py",
  "src/gambit/factor_store.py",
  "src/gambit/holiday_calendars.py",
  "src/gambit/execution_costs.py",
  "src/gambit/evaluator.py",
  "src/gambit/instruments.py",
  "src/gambit/interactive_plot.py",
  "src/gambit/market_data.py",
  "src/gambit/markets.py",
  "src/gambit/optimize.py",
  "src/gambit/pq_types.py",
  "src/gambit/portfolio.py",
  "src/gambit/pnl_calculation.py",
  "src/gambit/position_sizing.py",
  "src/gambit/pq_io.py",
  "src/gambit/pq_utils.py",
  "src/gambit/risk.py",
  "src/gambit/risk_measures.py",
  "src/gambit/risk_reporting.py",
  "src/gambit/return_reporting.py",
  "src/gambit/stages.py",
  "src/gambit/strategy.py",
  "src/gambit/strategy_builder.py",
  "src/gambit/strategy_components.py",
  "src/gambit/strategy_contracts.py",
  "src/gambit/trade_reconciliation.py",
  "src/gambit/universe.py",
  "src/gambit/var_risk.py",
  "tests/test_regressions.py",
]
mypy_path = "src"
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.cibuildwheel]
build = ["cp310-*", "cp311-*", "cp312-*"]
skip = ["*-musllinux_*", "*-win32", "*-win_amd64"]
test-command = [
  "python -c \"import gambit, gambit._factor_cache, gambit._io, gambit._options, gambit.compute_pnl; from importlib.metadata import version; assert version('gambit-markets') == gambit.__version__\"",
  "gambit-factor-cache --help",
]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
before-all = "dnf install -y libzip-devel"

[tool.cibuildwheel.macos]
archs = ["auto"]
before-all = "brew install libzip"
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
